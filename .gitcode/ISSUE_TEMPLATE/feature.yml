name: "✨ 功能建议 / Feature Request"
description: 为 AsNumpy 提出一个新想法或功能 / Suggest an idea or new feature for AsNumpy
title: "[FEATURE] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 感谢您愿意提出改进建议！ / Thanks for suggesting an improvement!
        请告诉我们您希望 AsNumpy 增加什么功能。在提交前，请搜索现有 Issue 以确保没有重复的建议。
        Please tell us what functionality you'd like to see in AsNumpy. Before submitting, please search existing issues to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: "❓ 相关问题是？ / Related Problem"
      description: "这个功能建议是否与某个问题相关？请清晰描述。 / Is your feature request related to a problem? Please describe clearly."
      placeholder: |
        例如：当我尝试在NPU上执行 `np.linalg.eig` 时，AsNumpy 还不支持，导致我必须将数据拷贝回CPU计算，效率很低。
        Example: When I try to use `np.linalg.eig` on NPU, AsNumpy doesn't support it yet, so I have to copy data back to CPU for computation, which is inefficient.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "💡 期望的解决方案 / Desired Solution"
      description: "你希望实现什么样的API或行为？请尽可能详细描述。 / What API or behavior would you like to see? Please describe in detail as much as possible."
      placeholder: |
        希望添加 `ap.linalg.eig` 函数，用于计算方阵的特征值和特征向量，接口设计与 NumPy 的 `numpy.linalg.eig` 保持一致。
        I hope to add `ap.linalg.eig` function to compute eigenvalues and eigenvectors of a square matrix, with an interface consistent with NumPy's `numpy.linalg.eig`.
    validations:
      required: true

  - type: dropdown
    id: numpy_api
    attributes:
      label: "🔗 对应的NumPy API / Corresponding NumPy API"
      description: "这个功能对应NumPy的哪个API？（如果适用） / Which NumPy API does this correspond to? (if applicable)"
      options:
        - np.add / np.sum / 基础数学运算 / Basic math
        - np.matmul / 矩阵乘法 / Matrix multiplication
        - np.dot / 点积 / Dot product
        - np.linalg / 线性代数 / Linear Algebra
        - np.random / 随机抽样 / Random sampling
        - np.fft / 傅里叶变换 / FFT
        - np.ma (远期) / Masked arrays (long-term)
        - np.polynomial (远期) / Polynomial (long-term)
        - 其他 (请在下文描述) / Other (please describe below)
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 考虑过的替代方案 / Alternatives Considered"
      description: "你考虑过哪些替代方法或变通方案？ / Any alternative solutions or workarounds you've considered?"
      placeholder: |
        目前我只能在CPU上用NumPy计算，然后拷贝到NPU，但这样数据迁移开销很大。或者使用其他NPU库，但它们与NumPy接口不兼容。
        Currently I can only compute on CPU with NumPy and then copy to NPU, but the data transfer overhead is huge. Or use other NPU libraries, but their interfaces are not compatible with NumPy.

  - type: textarea
    id: context
    attributes:
      label: "📎 附加信息 / Additional Context"
      description: "添加任何其他背景信息、用例、代码示例或参考资料（如 Ascend C 算子思路、OpenBOAT 仓库等）。 / Add any other context, use cases, code examples, or references (e.g., Ascend C operator ideas, OpenBOAT repository, etc.) here."
      placeholder: |
        例如：我建议参考NumPy的实现方式，或者提供一些相关的 Ascend C 算子实现思路、OpenBOAT 中的参考代码。
        Example: I suggest referring to NumPy's implementation, or provide some related Ascend C operator implementation ideas, reference code from OpenBOAT.

  - type: checkboxes
    id: terms
    attributes:
      label: "📋 确认项 / Checklist"
      description: "提交前请确认 / Please confirm before submitting"
      options:
        - label: "我已搜索现有Issue，确认没有重复的功能建议。 / I have searched existing issues and confirmed this is not a duplicate."
          required: true
        - label: "我理解这个功能可能需要根据项目路线图进行规划，并愿意参与测试或提供反馈。 / I understand this feature may be planned according to the project roadmap, and I am willing to participate in testing or provide feedback."
          required: true