# cpplint configuration for asnumpy
# Run: cpplint --recursive csrc/ include/ bindings/python/

# Line length matches .clang-format ColumnLimit
linelength=120

# Filter rules:
# - build/header_guard: Our headers use #pragma once
# - build/include_what_you_use: CANN SDK headers have implicit transitive includes
# - build/include_order: CANN SDK headers don't follow Google include order conventions
# - build/namespaces: Our namespace naming (asnumpy::detail etc.) differs from Google snake_case
# - build/c++11: Allow C++20 features without warnings
# - readability/todo: TODO comments without issue reference are acceptable during development
# - runtime/references: We use Left alignment (int& ref) matching Google style
# - runtime/int: Allow int usage alongside int64_t where appropriate
# - readability/namespace: clang-format handles namespace indentation
# - readability/braces: clang-format handles brace placement
# - whitespace/braces: clang-format handles brace placement
# - whitespace/indent: clang-format handles indentation (4 spaces, not 2)
# - whitespace/tab: clang-format converts tabs to spaces
# - whitespace/line_length: ColumnLimit=120, clang-format handles wrapping
# - whitespace/operators: clang-format handles operator spacing
# - whitespace/parens: clang-format handles paren spacing
# - whitespace/comments: clang-format handles comment formatting
# - whitespace/end_of_line: clang-format trims trailing whitespace
# - whitespace/newline: clang-format handles blank line normalization
# - whitespace/comma: clang-format handles comma spacing
# - whitespace/blank_line: clang-format handles blank line formatting
# - whitespace/ending_newline: clang-format ensures files end with newline
# - whitespace/indent_namespace: clang-format handles namespace indentation
# - whitespace/semicolon: clang-format handles semicolon spacing
filter=-build/header_guard,-build/include_what_you_use,-build/include_order,-build/namespaces,-runtime/references,-runtime/int,-readability/namespace,-readability/braces,-whitespace/braces,-whitespace/indent,-whitespace/indent_namespace,-whitespace/tab,-whitespace/line_length,-whitespace/operators,-whitespace/parens,-whitespace/comments,-whitespace/end_of_line,-whitespace/newline,-whitespace/comma,-whitespace/blank_line,-whitespace/ending_newline,-whitespace/semicolon

# Exclude third-party and generated files
exclude_files=build/,\.git/,.*\.pyc$,.*\.so$
